name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  scan:
    name: Security scan (fail on High)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The template's Dockerfile is a placeholder doing `COPY package*.json`
      # and `npm ci`, so it cannot build in the bare template, which has no
      # manifest. These steps activate on their own once a generated project
      # adds one.
      #
      # The check must live in a step, not a job-level `if`: hashFiles() and
      # file tests evaluate against the workspace, which is still empty before
      # checkout runs.
      - name: Detect buildable project
        id: detect
        run: |
          if [ -f package.json ] || [ -f requirements.txt ] || [ -f go.mod ] || [ -f Cargo.toml ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "No project manifest found — skipping image build and scan."
          fi

      - name: Build scan image
        if: steps.detect.outputs.buildable == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: security-scan:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scan
        if: steps.detect.outputs.buildable == 'true'
        run: |
          echo "Add your scanner here — e.g. trivy, grype, npm audit --json, pip-audit"
          echo "Write findings to scan-results.json / scan-results.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: security-scan-results
          path: scan-results.*
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        run: |
          echo "## Security scan results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results.txt ]; then cat scan-results.txt >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fail on High severity
        run: |
          if [ -f scan-results.txt ] && grep -qi "high" scan-results.txt; then
            echo "High severity finding(s) detected — failing the build."
            exit 1
          fi
