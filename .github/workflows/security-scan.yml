name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  scan:
    name: Security scan (fail on High)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: security-scan:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scan
        run: |
          echo "Add your scanner here — e.g. trivy, grype, npm audit --json, pip-audit"
          echo "Write findings to scan-results.json / scan-results.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: security-scan-results
          path: scan-results.*
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        run: |
          echo "## Security scan results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f scan-results.txt ]; then cat scan-results.txt >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fail on High severity
        run: |
          if [ -f scan-results.txt ] && grep -qi "high" scan-results.txt; then
            echo "High severity finding(s) detected — failing the build."
            exit 1
          fi
