name: Deploy Production (Vercel)

# Production deployment for Vercel-hosted projects.
# Uses Vercel OIDC token when available, falls back to VERCEL_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Skip if VERCEL_TOKEN is not configured — the bare template does not have
    # a linked Vercel project. Downstream projects should add the secret and,
    # if needed, a `vercel.json` or `vercel` config block in package.json.
    if: secrets.VERCEL_TOKEN != ''
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify deployment
        run: |
          url=$(vercel ls --prod --token=${{ secrets.VERCEL_TOKEN }} | head -n 1 | awk '{print $2}')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          if [ "$status" != "200" ]; then
            echo "Deployment verification failed: HTTP $status"
            exit 1
          fi