name: CI

# ---------------------------------------------------------------------------
# Replace the `run:` placeholders with your stack's commands, and the
# setup-node step with your runtime (setup-python / setup-dotnet / setup-go).
# Everything else — triggers, permissions, concurrency, SHA pins, the gate
# job — is production-ready as shipped. Keep it.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group: # required for GitHub merge queues to report status

# Least privilege. Every job inherits read-only; grant more per-job, never here.
permissions:
  contents: read

# One in-flight run per PR. Supersede stale PR runs, but never cancel a run
# that is gating main or validating a merge-queue batch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Supply-chain guard. An invented SHA looks perfectly plausible in review but
  # stops the job from starting at all ("Unable to resolve action"). Verifying
  # each pin against its live tag is the only way to catch it before merge.
  action-pins:
    name: Verify action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allow-same-org: true
      - name: Verify every pinned SHA matches its version comment
        run: ./scripts/verify-action-pins.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allow-same-org: true
      # Skips itself in the bare template, which has no lockfile — `cache: npm`
      # hard-fails when one is absent. Runs automatically once your project has
      # a lockfile. Swap for setup-python / setup-dotnet / setup-go as needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') != ''
        with:
          node-version: 25
          cache: npm
      - name: Install dependencies
        run: echo "Replace — e.g. npm ci"
      - name: Lint
        run: echo "Replace — e.g. npm run lint"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allow-same-org: true
      # Skips itself in the bare template, which has no lockfile — `cache: npm`
      # hard-fails when one is absent. Runs automatically once your project has
      # a lockfile. Swap for setup-python / setup-dotnet / setup-go as needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') != ''
        with:
          node-version: 25
          cache: npm
      - name: Install dependencies
        run: echo "Replace — e.g. npm ci"
      - name: Run tests
        run: echo "Replace — e.g. npm test"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allow-same-org: true
      # Skips itself in the bare template, which has no lockfile — `cache: npm`
      # hard-fails when one is absent. Runs automatically once your project has
      # a lockfile. Swap for setup-python / setup-dotnet / setup-go as needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock') != ''
        with:
          node-version: 25
          cache: npm
      - name: Install dependencies
        run: echo "Replace — e.g. npm ci"
      - name: Build
        run: echo "Replace — e.g. npm run build"

  # ---------------------------------------------------------------------------
  # OWASP ZAP Baseline Security Scan
  # Detects common vulnerabilities in web applications (XSS, SQLi, etc.)
  # Integrates with ASD Essential Eight and OWASP Top 10 compliance
  # ---------------------------------------------------------------------------
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up OWASP ZAP
        uses: zapro/zap-baseline-action@v0.15.0
        with:
          target: 'http://localhost:3000'  # Replace with your app URL
          token: ${{ secrets.ZAP_API_TOKEN }}
          fail-on: 'medium'  # Fail on medium severity+ vulnerabilities
          fail-on-severity: 'medium'
          rules: 'owasp-profiles/modified-risk'
          # Generate HTML report
          html: zap-report.html
          # Generate JSON report
          json: zap-report.json

      - name: Upload ZAP Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: |
            zap-report.html
            zap-report.json

      - name: Check for Critical Vulnerabilities
        run: |
          if [ -f zap-report.json ]; then
            critical_count=$(python3 -c "
import json
with open('zap-report.json') as f:
    data = json.load(f)
    # Count alerts with critical severity
    critical = [a for a in data.get('site']['alerts', []) if a.get('risk', '').lower() == 'critical']
    print(len(critical))
")
            if [ \"$critical_count\" -gt 0 ]; then
              echo "::error ::Critical vulnerabilities found: $critical_count"
              exit 1
            fi
          fi

  # ---------------------------------------------------------------------------
  # One stable required check. Point the branch ruleset at "CI Gate" alone —
  # then adding, renaming, or splitting a job above never means editing branch
  # protection. `if: always()` ensures the gate reports even when a need fails.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    if: always()
    needs: [action-pins, lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed (saw '$r')."
              exit 1
            fi
          done
          echo "All required CI jobs passed."
