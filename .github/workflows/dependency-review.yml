name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'requirements.txt'
      - 'Pipfile.lock'
      - 'poetry.lock'
      - 'pom.xml'
      - 'build.gradle'
      - 'go.sum'
      - 'go.mod'
      - 'Cargo.lock'
      - '.csproj'
      - 'packages.config'
      - 'paket.dependencies'
      - '.github/workflows/dependency-review.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # This workflow also triggers on changes to itself (see `paths` above),
      # which in the bare template means running with no dependency manifest
      # anywhere for the action to review. Detect that and skip rather than fail.
      - name: Detect dependency manifests
        id: detect
        run: |
          if git ls-files | grep -qE '(^|/)(package\.json|requirements\.txt|Pipfile|pyproject\.toml|go\.mod|Cargo\.toml|pom\.xml|build\.gradle|[^/]+\.csproj)$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifests in this repository — nothing to review."
          fi

      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        if: steps.detect.outputs.found == 'true'
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
