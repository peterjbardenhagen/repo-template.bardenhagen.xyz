name: Deploy Preview (Vercel)

# Optional workflow for Vercel-hosted projects. Requires VERCEL_TOKEN,
# VERCEL_ORG_ID, and VERCEL_PROJECT_ID repo secrets. Delete this file
# if the project isn't deployed on Vercel.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    # Skip if VERCEL_TOKEN is not configured — the bare template does not have
    # a linked Vercel project. Downstream projects should add the secret and,
    # if needed, a `vercel.json` or `vercel` config block in package.json.
    if: secrets.VERCEL_TOKEN != ''
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Passed through the environment rather than interpolated into each
      # `run:` string. Inline `${{ secrets.* }}` is substituted into the script
      # before the shell sees it, which both risks injection and can echo the
      # secret in traces.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vercel CLI
        if: steps.cfg.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.cfg.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.cfg.outputs.configured == 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        if: steps.cfg.outputs.configured == 'true'
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${process.env.PREVIEW_URL}`
            })
