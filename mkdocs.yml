site_name: Repo Template — Agentic AI SDLC
site_description: Practical standards for agentic software delivery, engineering, security, and repository governance.
site_url: https://peterjbardenhagen.github.io/repo-template.bardenhagen.xyz/
repo_url: https://github.com/peterjbardenhagen/repo-template.bardenhagen.xyz
repo_name: peterjbardenhagen/repo-template.bardenhagen.xyz
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://peter.bardenhagen.xyz/
      name: Peter Bardenhagen — profile
    - icon: fontawesome/brands/linkedin
      link: https://au.linkedin.com/in/peterbardenhagen
      name: Peter Bardenhagen on LinkedIn

