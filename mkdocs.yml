      - GitHub CLI and secret management: engineering/github-cli-and-secret-management.md
      - GitHub settings and features: engineering/github-settings-and-features.md
      - Agent-framework-agnostic development: engineering/agent-framework-agnostic.md
      - MCP and agent skills: engineering/mcp-and-agent-skills.md
      - GitHub Actions best practices: engineering/github-actions-best-practices.md
      - GitHub standards: engineering/github-standards.md
